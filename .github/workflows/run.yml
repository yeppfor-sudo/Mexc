name: MEXC EMA20 Long Bot PKT

on:
  schedule:
    # PKT 1AM,5AM,9AM,1PM,5PM,9PM = UTC 20:00,0:00,4:00,8:00,12:00,16:00
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install deps
        run: pip install ccxt pandas requests matplotlib pytz

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
