name: MEXC 1m RealTime

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          pip install ccxt pandas requests matplotlib
      - name: Run scanner with bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          bash -c '
          echo "Starting 1m scanner..."
          python bot.py
          echo "Done"
          '
      - name: Save 24h state
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add alerted.json || true
          git commit -m "alert [skip ci]" || true
          git push || true
