name: AI Self-Learning Sniper V9
on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 min = 24/7 real time
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ccxt pandas requests
      - name: Restore memory
        uses: actions/cache@v4
        with:
          path: |
            trades_memory.json
            daily_*.json
          key: ai-memory-${{ github.run_id }}
          restore-keys: ai-memory-
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
        run: python bot.py
      - name: Save memory
        uses: actions/cache/save@v4
        with:
          path: |
            trades_memory.json
            daily_*.json
          key: ai-memory-${{ github.run_id }}
